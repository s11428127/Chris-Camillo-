name: DEBUG · 探開放資料源

# 暫時性工具：104 擋 Cloudflare，改探哪些「官方開放」的來源在 Actions 上可用。
# 查完就刪。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 探端點
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          probe () {
            echo "══════════════════════════════════════════"
            echo "[$2] $1"
            curl -s -D /tmp/h -o /tmp/b --max-time 25 -L -H "User-Agent: $UA" "$1" || echo "(curl 失敗)"
            head -1 /tmp/h; grep -i '^content-type' /tmp/h || true
            echo "--- body 前 400 字 ---"; head -c 400 /tmp/b; echo; echo
          }
          probe "https://openapi.twse.com.tw/v1/opendata/t187ap05_L" "上市月營收"
          probe "https://openapi.twse.com.tw/v1/opendata/t187ap05_O" "上櫃月營收"
          probe "https://opendata.wda.gov.tw/api/wda/JobOpenData?$top=2" "勞動部職缺"
          probe "https://data.gov.tw/api/front/dataset/search?qs=%E8%81%B7%E7%BC%BA" "data.gov.tw 搜尋"
          probe "https://www.dcard.tw/service/api/v2/forums/tech/posts?limit=5" "Dcard tech"
          probe "https://trends.google.com/trends/api/explore?hl=zh-TW&tz=-480" "Google Trends"
          probe "https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY?date=20260801&stockNo=6691&response=json" "證交所日成交"
